# Main model evaluation config
defaults:
  - data: kitml
  - evaluator: tmr
  - model: stablemofusion
  - _self_

# Model checkpoint
model_checkpoint_dir: ???
model_ckpt: last

# Evluator checkpoint
evaluator_checkpoint_dir: ???
evaluator_ckpt: last

# Split to evaluate on
split: test

# Evaluation settings
device: cuda
batch_size: 256
num_samples: null  # null = all, or specify number

# Retrieval calculation settings
retrieval_batch_size: -1  # -1 = entire dataset, 32 = batched
distance_metric: 'euclidean'  # 'euclidean' or 'cosine'
normalize_fid: true  # Whether to normalize features when calculating FID

# Output
model_name: ${hydra:runtime.choices.model}
evaluator_name: ${hydra:runtime.choices.evaluator}
data_name: ${data.dataset_name}
output_dir: evaluation_results/model_${model_name}_eval_${evaluator_name}_${data_name}_${split}

# Logging
seed: 1234
logger_level: INFO

