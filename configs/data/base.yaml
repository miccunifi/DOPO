_target_: src.data.text_motion_handler.TextMotionDatasetHandler
dataset_name: ???
augmented: true
path: /deck/datasets/Black_datasets(H_K_B)/annotations/${data.dataset_name}

with_noise: false

motion_loader_name: ${hydra:runtime.choices.data/motion_loader}
base_dir: /deck/datasets/Black_datasets(H_K_B)/motions/${data.motion_loader_name}

text_to_token_emb:
  _target_: src.data.text.TokenEmbeddings
  path: /deck/datasets/Black_datasets(H_K_B)/annotations/${data.dataset_name}
  modelname: distilbert-base-uncased
  preload: true
text_to_sent_emb:
  _target_: src.data.text.SentenceEmbeddings
  path: /deck/datasets/Black_datasets(H_K_B)/annotations/${data.dataset_name}
  modelname: sentence-transformers/all-mpnet-base-v2
  preload: true
clip_embedder: 
  _target_: src.data.text.ClipEmbeddings
  dataname: ${data.dataset_name}
  modelname: "ViT-B/32"
  device: ${device}
  preload: true
  mean_pooling: false
  disable: false
  nfeats: 512
preload: true

defaults:
  - motion_loader: smplrifke
  - _self_