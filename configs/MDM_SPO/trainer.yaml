trainer:
  _target_: pytorch_lightning.Trainer

  max_epochs: 20
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  accelerator: gpu
  devices: 1
  val_check_interval: 1 
  limit_val_batches: 3  

  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: ${run_dir}/checkpoints
      filename: latest-{epoch}
      every_n_epochs: 1
      save_top_k: 1
      save_last: true
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: ${run_dir}/checkpoints
      filename: latest-{epoch}
      monitor: step
      mode: max
      every_n_epochs: 2
      save_top_k: -1
      save_last: false
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      dirpath: ${run_dir}/checkpoints
      filename: best-{epoch}-{Validation.tmr:.4f}  # <-- NUOVO
      monitor: Validation.tmr  # <-- Nome esatto della metrica loggata
      mode: max  # <-- Massimizza il TMR score
      save_top_k: 1  # <-- Salva solo il migliore
      save_last: false
    - _target_: src.callback.progress.ProgressLogger
      precision: 3
    - _target_: src.callback.tqdmbar.TQDMProgressBar

  logger:
    _target_: models.MDM.src.logger.csv.CSVLogger
    save_dir: ${run_dir}
    name: logs