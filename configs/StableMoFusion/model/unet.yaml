_target_: models.stablemofusion_adapter.StableMoFusionLightning

# Model architecture
input_feats: ${data.motion_loader.nfeats}
text_latent_dim: 256
base_dim: 512
dim_mults: [2, 2, 2, 2]
time_dim: 512
adagn: true
no_eff: false
cond_mask_prob: 0.1  # ✓ Come originale

# Diffusion params
diffusion_steps: 1000
beta_schedule: linear
prediction_type: sample

# Optimizer params
lr: 2.0e-4           # ✓ Come originale
weight_decay: 1.0e-2 # ✓ Come originale
decay_rate: 0.9      # ✓ Come originale
update_lr_steps: 5000 # ✓ Come originale
clip_grad_norm: 1.0  # ✓ Come originale

# EMA params
use_ema: true
ema_decay: 0.9999      # ✓ Come originale
ema_update_every: 32   # ✓ Come originale

motion_normalizer:
  _target_: src.data.motion.Normalizer
  base_dir: stats/${hydra:runtime.choices.data}/${hydra:runtime.choices.data/motion_loader}
  eps: 1e-12
  disable: false